default: &default
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("DB_POOL") { ENV.fetch("RAILS_MAX_THREADS", 5).to_i + 4 } %>
  username: <%= ENV.fetch("POSTGRES_USER", "postgres") %>
  password: <%= ENV.fetch("POSTGRES_PASSWORD", "postgres") %>
  host: <%= ENV.fetch("DB_HOST", "localhost") %>
  port: <%= ENV.fetch("DB_PORT", 5432) %>

development:
  <<: *default
  database: youtube_lab_development

test:
  <<: *default
  database: youtube_lab_test

production:
  <<: *default
  database: youtube_lab_production
  url: <%= ENV["DATABASE_URL"] %>
